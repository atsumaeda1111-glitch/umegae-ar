<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梅ヶ枝 - 現象学的ブーストAR (Proto 1.2)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Hiragino Mincho ProN', serif;
            color: #faf8f5;
            /* iOSの長押しによる選択・拡大鏡・コールアウトを抑止 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        #video-background {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }
        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }
        #overlay-ui {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* iOS Safariのツールバーに隠れないよう実表示領域を使う */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            box-sizing: border-box;
            padding: 60px 20px 30px;
        }
        .hud-text {
            font-size: 14px;
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
            opacity: 0;
            transition: opacity 1.5s ease;
            background: rgba(0,0,0,0.4);
            padding: 5px 10px;
            border-radius: 4px;
            text-align: center;
        }
        #start-button {
            position: absolute;
            z-index: 100;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background: rgba(26, 42, 58, 0.9);
            border: 1px solid #cb5a3e;
            color: #faf8f5;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 2px;
            pointer-events: auto;
        }
        #reticle {
            width: 40px; height: 40px;
            border: 1px solid rgba(250, 248, 245, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            transition: border-color 0.5s ease, transform 0.5s ease, opacity 1s ease;
        }
        /* ---- タスク3: エラー/フォールバックUI ---- */
        #error-panel {
            display: none;
            position: absolute;
            z-index: 200;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(85vw, 420px);
            background: rgba(15, 20, 26, 0.95);
            border: 1px solid #cb5a3e;
            border-radius: 4px;
            padding: 24px 20px;
            box-sizing: border-box;
            pointer-events: auto;
            font-size: 13px;
            line-height: 1.8;
        }
        #error-panel h2 { font-size: 15px; margin: 0 0 10px; color: #e8a08c; }
        #error-panel button {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background: rgba(203, 90, 62, 0.85);
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 2px;
        }
        #error-panel button.secondary { background: rgba(80, 90, 100, 0.7); }
        /* ---- タスク4: 体験終了後のログパネル ---- */
        #log-panel {
            display: none;
            position: absolute;
            z-index: 150;
            bottom: 16px; left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            text-align: center;
        }
        #log-panel button {
            margin: 4px;
            padding: 8px 16px;
            background: rgba(26, 42, 58, 0.85);
            border: 1px solid rgba(250,248,245,0.35);
            color: #faf8f5;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.08em;
            cursor: pointer;
            border-radius: 2px;
        }
        #log-status { font-size: 11px; opacity: 0.7; margin-top: 4px; }
        /* 白フェード(4枚目のシャットアウト用ではなく朝霧の補助) */
        #mist-veil {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at 50% 60%, rgba(240,242,245,0.35), rgba(240,242,245,0) 70%);
            z-index: 2;
            opacity: 0;
            transition: opacity 3s ease;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="start-button">静寂をひらく</button>
    <video id="video-background" autoplay playsinline muted></video>
    <div id="mist-veil"></div>
    <div id="reticle"></div>
    <div id="canvas-container"></div>

    <div id="overlay-ui">
        <div id="hud-top" class="hud-text">梅ヶ枝を中央に捉え、静止してください</div>
        <div id="hud-bottom" class="hud-text">剥がすたびに、一歩進む</div>
    </div>

    <div id="error-panel">
        <h2 id="error-title"></h2>
        <div id="error-body"></div>
    </div>

    <div id="log-panel">
        <button id="btn-send-log">実験ログを送信</button>
        <button id="btn-csv-log">CSVを保存</button>
        <div id="log-status"></div>
    </div>

    <div id="version-tag" style="position:absolute;right:8px;top:4px;z-index:20;font-size:10px;opacity:0.5;pointer-events:none;">v1.5</div>
    <div id="debug-panel" style="display:none;position:absolute;left:0;bottom:0;width:100vw;z-index:300;background:rgba(0,0,0,0.75);color:#8f8;font-family:monospace;font-size:10px;line-height:1.5;padding:6px 8px;box-sizing:border-box;pointer-events:none;white-space:pre-wrap;"></div>

    <script>
    'use strict';

    /* ================================================================
     * 梅ヶ枝 現象学的ブーストAR Proto v1.2
     *  タスク1: 4層の身体同期ナラティブ(剥がす = 伊予街道の歩み)
     *  タスク2: 高周波トランジエント特化のオーディオグラフ
     *  タスク3: カメラ/センサーの堅牢な起動とフォールバック
     *  タスク4: 3群間比較実験用ミリ秒ログ(GAS送信 + CSV出力)
     * ================================================================ */

    // ---- 実験条件 (URLに ?cond=A / ?cond=B / ?cond=C を付与して切替) ----
    const CONDITION = (function() {
        const m = location.search.match(/[?&]cond=([ABC])/i);
        return m ? m[1].toUpperCase() : 'C'; // 本システム = C群(引き算のAR)
    })();

    // ---- グローバル状態 ----
    let audioCtx = null;
    let masterGain, ambienceGain;          // 演出音の全体系統
    let scene, camera, renderer;
    let shadowMesh, mistParticles, komorebiGroup;
    let isStatic = false;
    let lastStaticAt = -Infinity;   // 静止が解除された時刻(タップ時の揺れ救済用)
    let staticTimer = 0;
    let layerIndex = 0;                    // 0=未開始, 1..4=剥がした枚数
    let experienceStarted = false;
    let experienceEnded = false;
    let orientationActive = false;
    let cameraActive = false;
    let lastOrientationTs = 0;
    let lastAlpha = null, lastBeta = null, lastGamma = null;
    const MOTION_THRESHOLD = 0.8;
    const STATIC_HOLD_MS = 2000;

    // 継続音(風・霧)のノードを層ごとに保持して4枚目で全停止できるようにする
    const sustainedNodes = [];

    const hudTop = document.getElementById('hud-top');
    const hudBottom = document.getElementById('hud-bottom');
    const reticle = document.getElementById('reticle');
    const videoElement = document.getElementById('video-background');
    const mistVeil = document.getElementById('mist-veil');

    /* ================================================================
     * タスク4: 実験ログ (ミリ秒単位)
     * ================================================================ */
    const ExperimentLog = {
        sessionId: 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        t0: performance.now(),
        events: [],
        peelTimestamps: [],       // 各層を剥がした時刻 (ms, t0基準)
        staticEnteredAt: null,    // 静止状態に入った時刻
        totalStaticMs: 0,

        now() { return Math.round((performance.now() - this.t0) * 1000) / 1000; },

        add(event, detail) {
            this.events.push({ t: this.now(), event: event, detail: detail || null });
        },

        markStatic(state) {
            const t = this.now();
            if (state && this.staticEnteredAt === null) {
                this.staticEnteredAt = t;
                this.add('static_enter');
            } else if (!state && this.staticEnteredAt !== null) {
                this.totalStaticMs += t - this.staticEnteredAt;
                this.add('static_exit', { heldMs: t - this.staticEnteredAt });
                this.staticEnteredAt = null;
            }
        },

        markPeel(layer) {
            const t = this.now();
            this.peelTimestamps.push(t);
            const intervals = this.peelIntervals();
            this.add('peel', {
                layer: layer,
                intervalMs: intervals.length ? intervals[intervals.length - 1] : null
            });
        },

        peelIntervals() {
            const out = [];
            for (let i = 1; i < this.peelTimestamps.length; i++) {
                out.push(Math.round((this.peelTimestamps[i] - this.peelTimestamps[i - 1]) * 1000) / 1000);
            }
            return out;
        },

        summary() {
            // 静止中のまま終わった場合は残り時間を加算
            let totalStatic = this.totalStaticMs;
            if (this.staticEnteredAt !== null) totalStatic += this.now() - this.staticEnteredAt;

            const intervals = this.peelIntervals();
            const mean = intervals.length
                ? intervals.reduce((a, b) => a + b, 0) / intervals.length : 0;
            const variance = intervals.length
                ? intervals.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / intervals.length : 0;

            return {
                totalDurationMs: Math.round(this.now()),
                totalStaticMs: Math.round(totalStatic),
                staticRatio: this.now() > 0
                    ? Math.round(totalStatic / this.now() * 1000) / 1000 : 0,
                peelCount: this.peelTimestamps.length,
                peelIntervalsMs: intervals,
                peelIntervalMeanMs: Math.round(mean),
                peelIntervalVarianceMs2: Math.round(variance),
                peelIntervalSdMs: Math.round(Math.sqrt(variance)),
                cameraOk: cameraActive,
                orientationOk: orientationActive,
                completed: layerIndex >= 4
            };
        },

        payload() {
            return JSON.stringify({
                sessionId: this.sessionId,
                condition: CONDITION,
                userAgent: navigator.userAgent,
                summary: this.summary(),
                events: this.events
            });
        },

        toCsv() {
            const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const lines = ['sessionId,tMs,event,detail'];
            this.events.forEach(e => {
                lines.push([this.sessionId, e.t, e.event,
                    esc(JSON.stringify(e.detail || ''))].join(','));
            });
            const s = this.summary();
            lines.push('');
            lines.push('summaryKey,value');
            Object.keys(s).forEach(k => lines.push(k + ',' + esc(JSON.stringify(s[k]))));
            return lines.join('\n');
        }
    };

    function sendLogToServer() {
        const status = document.getElementById('log-status');
        status.textContent = '送信中…';
        ExperimentLog.add('log_send_attempt');
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            // GAS内で表示されている場合は直接呼び出し
            google.script.run
                .withSuccessHandler(res => {
                    status.textContent = res && res.ok
                        ? '送信完了(スプレッドシートに記録)'
                        : '送信エラー: ' + (res && res.error);
                })
                .withFailureHandler(err => {
                    status.textContent = '送信失敗: ' + err + ' / CSV保存をご利用ください';
                })
                .saveExperimentLog(ExperimentLog.payload());
        } else if (/^https:\/\//.test(GAS_ENDPOINT)) {
            // 外部ホスティングからはGASのdoPostへ送信。
            // GASはCORSヘッダーを返さないため no-cors(結果は読めないが送信は完了する)
            fetch(GAS_ENDPOINT, { method: 'POST', mode: 'no-cors', body: ExperimentLog.payload() })
                .then(() => { status.textContent = '送信しました(スプレッドシートをご確認ください)'; })
                .catch(err => { status.textContent = '送信失敗: ' + err + ' / CSV保存をご利用ください'; });
        } else {
            status.textContent = '送信先が未設定です。CSV保存をご利用ください。';
        }
    }

    function downloadCsv() {
        const blob = new Blob(['﻿' + ExperimentLog.toCsv()], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'umegae_ar_log_' + ExperimentLog.sessionId + '.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    document.getElementById('btn-send-log').addEventListener('click', sendLogToServer);
    document.getElementById('btn-csv-log').addEventListener('click', downloadCsv);

    /* ================================================================
     * タスク3: カメラ/センサーの堅牢な起動
     * ================================================================ */
    function showErrorPanel(title, bodyHtml, buttons) {
        const panel = document.getElementById('error-panel');
        document.getElementById('error-title').textContent = title;
        const body = document.getElementById('error-body');
        body.innerHTML = bodyHtml;
        panel.querySelectorAll('button').forEach(b => b.remove());
        (buttons || []).forEach(def => {
            const b = document.createElement('button');
            b.textContent = def.label;
            if (def.secondary) b.className = 'secondary';
            b.addEventListener('click', def.onClick);
            panel.appendChild(b);
        });
        panel.style.display = 'block';
    }

    function hideErrorPanel() {
        document.getElementById('error-panel').style.display = 'none';
    }

    // GASはiframe(googleusercontent.com)内で動くため、環境によっては
    // カメラ許可ダイアログが出ない。その場合は公開URL(/exec)を新規タブで
    // 開き直す。iframe自身のURL(userCodeAppPanel)はリクエストごとの
    // 一時URLなので直接開いてはいけない(真っ白なページになる)。
    // EXEC_URL はGASテンプレートがデプロイ時に埋め込む。
    // 外部ホスティング時はスクリプトレットが評価されないため、固定値を使う。
    const EXEC_URL = '<?!= ScriptApp.getService().getUrl() ?>';
    const GAS_ENDPOINT = /^https:\/\//.test(EXEC_URL)
        ? EXEC_URL
        : 'https://script.google.com/macros/s/AKfycbzPIxcYwI9yr_955EoaaGZ95E2XvWrRzXgNMDRRjmx7sxiDtg1SWF2CsEImgjOilKPr/exec';
    function openSelfInNewTab() {
        const url = /^https:\/\//.test(EXEC_URL) ? EXEC_URL + location.search : location.href;
        window.open(url, '_blank');
    }

    function isFramed() {
        try { return window.self !== window.top; } catch (e) { return true; }
    }

    async function setupCamera() {
        // 事前チェック: セキュアコンテキストとAPIの存在
        if (!window.isSecureContext) {
            throw { kind: 'insecure', message: 'HTTPSではないためカメラを利用できません。' };
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw { kind: 'unsupported', message: 'このブラウザはカメラAPIに対応していません。' };
        }

        // 背面カメラ優先 → 失敗したら制約を緩めて再試行
        const attempts = [
            { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
            { video: { facingMode: 'environment' }, audio: false },
            { video: true, audio: false }
        ];
        let lastError = null;
        for (const constraints of attempts) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                await videoElement.play().catch(() => {}); // 自動再生失敗は無視(muted+playsinlineでほぼ発生しない)
                cameraActive = true;
                ExperimentLog.add('camera_ok', { constraints: JSON.stringify(constraints.video) });
                return;
            } catch (err) {
                lastError = err;
                // 権限拒否・ポリシーブロックは制約を変えても直らないため即座に抜ける
                if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) break;
            }
        }
        throw lastError || { kind: 'unknown', message: '原因不明のカメラエラー' };
    }

    function handleCameraError(err) {
        cameraActive = false;
        const name = err && err.name;
        ExperimentLog.add('camera_error', { name: name || err.kind, message: String(err.message || err) });

        const retryBtn = { label: '再試行', onClick: () => { hideErrorPanel(); startExperience(); } };
        const skipBtn = { label: 'カメラなしで続行', secondary: true, onClick: () => { hideErrorPanel(); proceedWithoutCamera(); } };
        const newTabBtn = { label: 'フルスクリーンで開く(推奨)', onClick: openSelfInNewTab };

        if (name === 'NotAllowedError' || name === 'SecurityError') {
            if (isFramed()) {
                // GASのiframeによるブロックの可能性が高い
                showErrorPanel('カメラがブロックされています',
                    'このページは埋め込み(iframe)内で動作しており、ブラウザの制限で' +
                    'カメラ許可ダイアログが表示できない場合があります。<br>' +
                    '下のボタンでページを直接開き直すと解決します。',
                    [newTabBtn, skipBtn]);
            } else {
                showErrorPanel('カメラの許可が必要です',
                    'ブラウザの設定でこのサイトのカメラを「許可」に変更してから再試行してください。<br>' +
                    '(iOS: 設定 → Safari → カメラ / Android: アドレスバーの鍵アイコン → 権限)',
                    [retryBtn, skipBtn]);
            }
        } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            showErrorPanel('カメラが見つかりません',
                '利用可能なカメラが検出できませんでした。他のアプリがカメラを使用中でないか確認してください。',
                [retryBtn, skipBtn]);
        } else if (name === 'NotReadableError') {
            showErrorPanel('カメラを起動できません',
                '他のアプリまたはタブがカメラを使用中の可能性があります。閉じてから再試行してください。',
                [retryBtn, skipBtn]);
        } else if (err && err.kind === 'insecure') {
            showErrorPanel('セキュリティ制限', err.message + '<br>URLが https:// で始まっているか確認してください。', [skipBtn]);
        } else if (err && err.kind === 'unsupported') {
            showErrorPanel('非対応ブラウザ', err.message + '<br>SafariまたはChromeの最新版でお試しください。', [skipBtn]);
        } else {
            showErrorPanel('カメラエラー', String((err && err.message) || err), [retryBtn, skipBtn]);
        }
    }

    function proceedWithoutCamera() {
        // カメラなしでも体験は継続(黒背景 + 音響 + 演出)
        ExperimentLog.add('camera_skipped');
        continueBoot();
    }

    // iOS 13+のセンサー許可は「タップ直後のジェスチャ内」でしか要求できない。
    // カメラ許可ダイアログを待った後に呼ぶと必ず失敗するため、
    // スタートボタンの1タップ目で単独で要求する。
    let orientationPermissionState = null;
    async function requestOrientationPermission() {
        if (typeof DeviceOrientationEvent === 'undefined') {
            orientationPermissionState = 'unsupported';
        } else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                orientationPermissionState = await DeviceOrientationEvent.requestPermission();
            } catch (err) {
                orientationPermissionState = 'error';
                ExperimentLog.add('orientation_request_error', { message: String(err) });
            }
        } else {
            orientationPermissionState = 'granted'; // Android等は許可不要
        }
        ExperimentLog.add('orientation_permission', { state: orientationPermissionState });
    }

    async function setupOrientation() {
        if (orientationPermissionState !== 'granted') {
            ExperimentLog.add('orientation_unavailable', { state: orientationPermissionState });
            return false;
        }
        window.addEventListener('deviceorientation', handleOrientation);

        // イベントが実際に届くか3秒間監視(iframe内では登録できても発火しないことがある)
        return new Promise(resolve => {
            setTimeout(() => {
                if (lastOrientationTs > 0) {
                    orientationActive = true;
                    ExperimentLog.add('orientation_ok');
                    resolve(true);
                } else {
                    window.removeEventListener('deviceorientation', handleOrientation);
                    ExperimentLog.add('orientation_no_events');
                    resolve(false);
                }
            }, 3000);
        });
    }

    function enableFallbackStaticMode() {
        // ジャイロが使えない環境: 長押し(600ms)を「静止」の代替とする
        ExperimentLog.add('fallback_static_mode');
        hudTop.innerText = '画面を長押しして、心を静めてください';
        hudTop.style.opacity = '1';
        let holdTimer = null;
        const start = () => {
            holdTimer = setTimeout(() => {
                setStaticState(true);
                // 長押し成立を明確にフィードバックし、次の操作(タップ)へ誘導する
                hudTop.innerText = '静まりました ── タップして、一枚剥がす';
            }, 600);
        };
        const cancel = () => { clearTimeout(holdTimer); };
        window.addEventListener('touchstart', start, { passive: true });
        window.addEventListener('touchend', cancel, { passive: true });
        window.addEventListener('touchcancel', cancel, { passive: true });
        window.addEventListener('mousedown', start);
        window.addEventListener('mouseup', cancel);
        // フォールバックでは一度静止に入ったら維持する(操作の複雑化を防ぐ)
    }

    /* ================================================================
     * タスク2: オーディオグラフ
     *
     *   各音源 ─→ (音源別フィルタ) ─→ ambienceGain ┐
     *   剥離音 ─→ bandpass(層別)  ──────────────────┤
     *                                               ▼
     *                        highpass 200Hz (環境低域ノイズ帯を遮断)
     *                                               ▼
     *                        peaking 3kHz +9dB Q0.9 (1.5k-6kHzの
     *                        トランジエント帯域をブースト)
     *                                               ▼
     *                        DynamicsCompressor (店頭騒音に埋もれない
     *                        よう平均音圧を持ち上げつつピークを保護)
     *                                               ▼
     *                        masterGain → destination
     * ================================================================ */
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const highpass = audioCtx.createBiquadFilter();
        highpass.type = 'highpass';
        highpass.frequency.value = 200;   // 200Hz以下の帯域を出力から排除
        highpass.Q.value = 0.7;

        const presence = audioCtx.createBiquadFilter();
        presence.type = 'peaking';
        presence.frequency.value = 3000;  // 1.5k-6kHz帯の中心
        presence.Q.value = 0.9;           // 帯域幅 ≒ 1.6k-5.6kHz
        presence.gain.value = 9;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -24;
        compressor.knee.value = 12;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.002;  // トランジエントの立ち上がりを潰さない
        compressor.release.value = 0.15;

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 1.0;

        ambienceGain = audioCtx.createGain();
        ambienceGain.gain.value = 1.0;

        // 屋外の「空気感」: 生成インパルス応答によるコンボリューション残響
        const reverb = audioCtx.createConvolver();
        reverb.buffer = makeImpulseResponse(2.8, 2.4);
        const reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.4;

        ambienceGain.connect(highpass);                    // ドライ
        ambienceGain.connect(reverb);                      // ウェット
        reverb.connect(reverbGain);
        reverbGain.connect(highpass);
        highpass.connect(presence);
        presence.connect(compressor);
        compressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        ExperimentLog.add('audio_init', { sampleRate: audioCtx.sampleRate });
    }

    // 残響用インパルス応答(左右非相関の減衰ノイズ = 屋外の淡い響き)
    function makeImpulseResponse(seconds, decayPow) {
        const len = Math.floor(audioCtx.sampleRate * seconds);
        const buffer = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
            const data = buffer.getChannelData(ch);
            for (let i = 0; i < len; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decayPow);
            }
        }
        return buffer;
    }

    // 微細な破裂音の連なり(実際に餅の層を剥がすときのパチパチという質感)
    // 前半はまばらに、後半に向かって密になる = 「ペリ……ペリペリッ」
    function makeCrackleBuffer(durationSec, pops) {
        const len = Math.floor(audioCtx.sampleRate * durationSec);
        const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let k = 0; k < pops; k++) {
            const pos = Math.floor(Math.pow(Math.random(), 0.6) * (len - 600));
            const amp = 0.35 + Math.random() * 0.65;
            const popLen = Math.floor(audioCtx.sampleRate * (0.003 + Math.random() * 0.009));
            for (let i = 0; i < popLen && pos + i < len; i++) {
                data[pos + i] += amp * (Math.random() * 2 - 1) * Math.pow(1 - i / popLen, 2);
            }
        }
        // クリップ防止
        for (let i = 0; i < len; i++) data[i] = Math.max(-1, Math.min(1, data[i]));
        return buffer;
    }

    // 減衰エンベロープ付きノイズバッファ(剥離音・摩擦音の素体)
    function makeNoiseBuffer(durationSec, decayPow) {
        const len = Math.floor(audioCtx.sampleRate * durationSec);
        const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decayPow);
        }
        return buffer;
    }

    // 剥離音: 微細クラックルの連なり「ペリ……ペリペリッ」(層が進むほど乾いて高く)
    function playPeelSound(layer) {
        const source = audioCtx.createBufferSource();
        source.buffer = makeCrackleBuffer(0.32, 55 + layer * 12);
        source.playbackRate.value = 0.95 + layer * 0.06;

        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2300 + layer * 450;  // 2.75k → 4.1kHz
        bp.Q.value = 1.1;                          // 広めの帯域で自然な質感を残す

        const g = audioCtx.createGain();
        g.gain.setValueAtTime(1.2, audioCtx.currentTime);

        source.connect(bp); bp.connect(g); g.connect(ambienceGain);
        source.start();
    }

    // 1枚目: 衣擦れ(布が擦れる不規則な「シュッ…サッ」を2往復)
    function playClothRustle() {
        for (let k = 0; k < 2; k++) {
            const t = audioCtx.currentTime + k * 0.45;
            const src = audioCtx.createBufferSource();
            src.buffer = makeNoiseBuffer(0.5, 1.2);
            src.playbackRate.value = 0.9 + Math.random() * 0.2; // 毎回わずかに違う音に
            const bp = audioCtx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 3400 + Math.random() * 800;
            bp.Q.value = 0.7;
            const g = audioCtx.createGain();
            // 擦り始め→抜き→擦り戻しの不均一な振幅(機械的な一定音を避ける)
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.32, t + 0.08);
            g.gain.linearRampToValueAtTime(0.1, t + 0.2);
            g.gain.linearRampToValueAtTime(0.26, t + 0.3);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
            src.connect(bp); bp.connect(g); g.connect(ambienceGain);
            src.start(t);
        }
    }

    // 2枚目: 土の道を歩く足音3歩 + うねりのある風
    function playFootstepsAndWind() {
        for (let k = 0; k < 3; k++) {
            // 歩行リズムは機械的な等間隔を避けてわずかに揺らす
            const t = audioCtx.currentTime + 0.2 + k * 0.62 + (Math.random() - 0.5) * 0.06;
            const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const stepOut = audioCtx.createGain();
            stepOut.gain.value = 1.0;
            if (pan) { pan.pan.value = (k % 2 === 0) ? -0.25 : 0.25; stepOut.connect(pan); pan.connect(ambienceGain); }
            else { stepOut.connect(ambienceGain); }

            // (a) 接地の「トッ」: 低めの短いノイズ(踏みしめる重さ)
            const thump = audioCtx.createBufferSource();
            thump.buffer = makeNoiseBuffer(0.07, 5);
            const thumpBp = audioCtx.createBiquadFilter();
            thumpBp.type = 'bandpass';
            thumpBp.frequency.value = 480;
            thumpBp.Q.value = 1.0;
            const thumpG = audioCtx.createGain();
            thumpG.gain.value = 1.5;
            thump.connect(thumpBp); thumpBp.connect(thumpG); thumpG.connect(stepOut);
            thump.start(t);

            // (b) 土と小石の「サクッ」: 微細クラックル(接地の直後にわずかに遅れて)
            const grit = audioCtx.createBufferSource();
            grit.buffer = makeCrackleBuffer(0.11, 14);
            grit.playbackRate.value = 0.9 + Math.random() * 0.25;
            const gritBp = audioCtx.createBiquadFilter();
            gritBp.type = 'bandpass';
            gritBp.frequency.value = 3000;
            gritBp.Q.value = 1.0;
            const gritG = audioCtx.createGain();
            gritG.gain.value = 0.8;
            grit.connect(gritBp); gritBp.connect(gritG); gritG.connect(stepOut);
            grit.start(t + 0.02);
        }

        // 風: 周波数・音量・定位がそれぞれ別周期でゆっくり揺らぐ(本物の風のうねり)
        const wind = audioCtx.createBufferSource();
        wind.buffer = makeNoiseBuffer(4.0, 0.15);
        wind.loop = true;
        const windBp = audioCtx.createBiquadFilter();
        windBp.type = 'bandpass';
        windBp.frequency.value = 1300;
        windBp.Q.value = 0.5;

        // 風色のゆらぎ(フィルタ中心周波数を大小2つのLFOで変調)
        const lfoSlow = audioCtx.createOscillator();
        const lfoSlowG = audioCtx.createGain();
        lfoSlow.frequency.value = 0.06;
        lfoSlowG.gain.value = 450;
        lfoSlow.connect(lfoSlowG); lfoSlowG.connect(windBp.frequency);
        lfoSlow.start();
        const lfoFast = audioCtx.createOscillator();
        const lfoFastG = audioCtx.createGain();
        lfoFast.frequency.value = 0.4;
        lfoFastG.gain.value = 120;
        lfoFast.connect(lfoFastG); lfoFastG.connect(windBp.frequency);
        lfoFast.start();

        const windGain = audioCtx.createGain();
        windGain.gain.setValueAtTime(0, audioCtx.currentTime);
        windGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 2.5);
        // 息づかいのような強弱
        const lfoAmp = audioCtx.createOscillator();
        const lfoAmpG = audioCtx.createGain();
        lfoAmp.frequency.value = 0.09;
        lfoAmpG.gain.value = 0.05;
        lfoAmp.connect(lfoAmpG); lfoAmpG.connect(windGain.gain);
        lfoAmp.start();

        wind.connect(windBp);
        if (audioCtx.createStereoPanner) {
            const windPan = audioCtx.createStereoPanner();
            const lfoPan = audioCtx.createOscillator();
            const lfoPanG = audioCtx.createGain();
            lfoPan.frequency.value = 0.07;
            lfoPanG.gain.value = 0.6;
            lfoPan.connect(lfoPanG); lfoPanG.connect(windPan.pan);
            lfoPan.start();
            windBp.connect(windPan); windPan.connect(windGain);
            sustainedNodes.push(lfoPan);
        } else {
            windBp.connect(windGain);
        }
        windGain.connect(ambienceGain);
        wind.start();
        sustainedNodes.push(wind, lfoSlow, lfoFast, lfoAmp);
    }

    // 3枚目: 遠くの梵鐘(実物の鐘の非整数倍音比 + わずかな「うなり」 + 長い余韻)
    function playBell() {
        const t = audioCtx.currentTime + 0.1;
        const base = 523; // 遠鳴りの芯(200Hzハイパスの上に置く)
        const partials = [
            { r: 1.0,  gain: 0.34, decay: 6.0 },
            { r: 1.19, gain: 0.22, decay: 4.5 },
            { r: 1.56, gain: 0.15, decay: 3.4 },
            { r: 2.0,  gain: 0.10, decay: 2.6 },
            { r: 2.66, gain: 0.07, decay: 1.8 },
            { r: 4.07, gain: 0.04, decay: 1.1 }
        ];
        partials.forEach(p => {
            // 2本をわずかにずらして重ね、実鐘特有のゆっくりした「うなり」を作る
            [0, 1.7].forEach(detune => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = base * p.r + detune;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(p.gain / 2, t + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0004, t + p.decay);
                osc.connect(g); g.connect(ambienceGain);
                osc.start(t);
                osc.stop(t + p.decay + 0.1);
            });
        });
        // 撞木が当たる瞬間の硬いアタック(ごく短い金属質ノイズ)
        const strike = audioCtx.createBufferSource();
        strike.buffer = makeNoiseBuffer(0.04, 6);
        const strikeBp = audioCtx.createBiquadFilter();
        strikeBp.type = 'bandpass';
        strikeBp.frequency.value = 2600;
        strikeBp.Q.value = 1.5;
        const strikeG = audioCtx.createGain();
        strikeG.gain.value = 0.35;
        strike.connect(strikeBp); strikeBp.connect(strikeG); strikeG.connect(ambienceGain);
        strike.start(t);
    }

    // 4枚目: 全音響を「フッ」とシャットアウト
    function silenceAll() {
        const t = audioCtx.currentTime;
        // 0.4秒で完全無音へ(クリックノイズ防止のため指数減衰)
        masterGain.gain.setValueAtTime(masterGain.gain.value, t);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        sustainedNodes.forEach(n => {
            try { n.stop(t + 0.45); } catch (e) {}
        });
        sustainedNodes.length = 0;
        setTimeout(() => { try { audioCtx.suspend(); } catch (e) {} }, 600);
    }

    /* ================================================================
     * 3D描画 (背景透過 + 層別ビジュアル)
     * ================================================================ */
    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 静止時に現れる「気配」のリング
        const geometry = new THREE.RingGeometry(0.1, 1.2, 32);
        const material = new THREE.MeshBasicMaterial({
            color: 0x000000, transparent: true, opacity: 0.0, side: THREE.DoubleSide
        });
        shadowMesh = new THREE.Mesh(geometry, material);
        scene.add(shadowMesh);

        // 1枚目: 朝霧(最初は不可視)
        // 四角い点ではなく、放射状にぼかした円形スプライトを大小2層重ねて
        // 逆方向に漂わせることで、面としての「霧」に見せる
        const mistTexture = (() => {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255,255,255,0.7)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        })();
        mistParticles = new THREE.Group();
        [
            { count: 35, size: 4.5, speed: 0.00022 },   // 奥の大きな霧塊
            { count: 60, size: 2.2, speed: -0.00038 }   // 手前の細かい霧
        ].forEach(cfg => {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(cfg.count * 3);
            for (let i = 0; i < cfg.count; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 14;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 9;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 5;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xf2f4f6, size: cfg.size, map: mistTexture,
                transparent: true, opacity: 0.0, depthWrite: false
            });
            const pts = new THREE.Points(geo, mat);
            pts.userData.speed = cfg.speed;
            mistParticles.add(pts);
        });
        scene.add(mistParticles);

        // 3枚目: 木漏れ日(加算合成の光点群、最初は不可視)
        komorebiGroup = new THREE.Group();
        for (let i = 0; i < 7; i++) {
            const circle = new THREE.Mesh(
                new THREE.CircleGeometry(0.25 + Math.random() * 0.4, 24),
                new THREE.MeshBasicMaterial({
                    color: 0xfff3d6, transparent: true, opacity: 0.0,
                    depthWrite: false, blending: THREE.AdditiveBlending
                })
            );
            circle.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 5, -1);
            circle.userData.phase = Math.random() * Math.PI * 2;
            komorebiGroup.add(circle);
        }
        scene.add(komorebiGroup);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const now = Date.now();

        if (experienceEnded) {
            // 4枚目以降: すべてを消灯したまま描画のみ継続
            shadowMesh.material.opacity = THREE.MathUtils.lerp(shadowMesh.material.opacity, 0, 0.15);
            mistParticles.children.forEach(p => {
                p.material.opacity = THREE.MathUtils.lerp(p.material.opacity, 0, 0.15);
            });
            komorebiGroup.children.forEach(c => {
                c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, 0, 0.15);
            });
        } else {
            // 静止の「気配」リング
            if (isStatic && shadowMesh.material.opacity < 0.4) {
                const wave = Math.sin(now * 0.002) * 0.03 + 0.3;
                shadowMesh.material.opacity = THREE.MathUtils.lerp(shadowMesh.material.opacity, wave, 0.05);
            } else if (!isStatic) {
                shadowMesh.material.opacity = THREE.MathUtils.lerp(shadowMesh.material.opacity, 0.0, 0.1);
            }
            // 朝霧: 1枚目以降、2層が逆方向にゆっくり漂う
            if (layerIndex >= 1 && layerIndex < 4) {
                // 2枚目以降は霧が薄れていく(街道を進み、霧が晴れる)
                const mistTarget = layerIndex === 1 ? 0.32 : 0.16;
                mistParticles.children.forEach(p => {
                    p.material.opacity = THREE.MathUtils.lerp(p.material.opacity, mistTarget, 0.008);
                    p.rotation.y += p.userData.speed;
                });
                mistParticles.position.y = Math.sin(now * 0.0003) * 0.25;
            }
            // 木漏れ日: 3枚目でゆらめきながら点灯
            if (layerIndex >= 3 && layerIndex < 4) {
                komorebiGroup.children.forEach(c => {
                    const target = 0.25 + Math.sin(now * 0.001 + c.userData.phase) * 0.1;
                    c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, Math.max(target, 0), 0.02);
                });
            }
        }
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ================================================================
     * ジャイロによる静止アフォーダンス判定
     * ================================================================ */
    function handleOrientation(event) {
        lastOrientationTs = performance.now();
        if (event.alpha === null && event.beta === null) return;

        if (lastAlpha === null) {
            lastAlpha = event.alpha; lastBeta = event.beta; lastGamma = event.gamma;
            return;
        }
        // alphaは0/360をまたぐため最短角度差で評価する
        let dAlpha = Math.abs(event.alpha - lastAlpha);
        if (dAlpha > 180) dAlpha = 360 - dAlpha;
        const diff = dAlpha + Math.abs(event.beta - lastBeta) + Math.abs(event.gamma - lastGamma);

        if (diff < MOTION_THRESHOLD) {
            staticTimer += 16.7;
            if (staticTimer > STATIC_HOLD_MS) setStaticState(true);
        } else {
            staticTimer = 0;
            setStaticState(false);
        }
        lastAlpha = event.alpha; lastBeta = event.beta; lastGamma = event.gamma;
    }

    function setStaticState(state) {
        if (isStatic === state) return;
        if (!state) lastStaticAt = performance.now();
        isStatic = state;
        ExperimentLog.markStatic(state);
        if (experienceEnded) return;
        if (state) {
            reticle.style.borderColor = 'rgba(203, 90, 62, 0.8)';
            reticle.style.transform = 'translate(-50%, -50%) scale(1.1)';
            hudTop.style.opacity = '1';
        } else {
            reticle.style.borderColor = 'rgba(250, 248, 245, 0.4)';
            reticle.style.transform = 'translate(-50%, -50%) scale(1.0)';
            hudTop.style.opacity = '0.3';
        }
    }

    /* ================================================================
     * タスク1: 剥がす行為と「伊予街道の歩み」の同期ナラティブ
     * ================================================================ */
    const LAYERS = [
        null,
        {   // 1枚目: 出発
            text: '一枚目 ── 朝霧の中、街道へ踏み出す',
            enact() {
                playClothRustle();
                mistVeil.style.opacity = '1';               // 画面全体の朝霧
                hudTop.innerText = '霧のむこうに、道がつづく';
            }
        },
        {   // 2枚目: 歩み
            text: '二枚目 ── 土を踏み、伊予街道の風を聞く',
            enact() {
                playFootstepsAndWind();
                mistVeil.style.opacity = '0.5';             // 霧が晴れはじめる
                hudTop.innerText = '風が、頬をなでていく';
            }
        },
        {   // 3枚目: 結界
            text: '三枚目 ── 遠く、金刀比羅の鐘が響く',
            enact() {
                playBell();
                mistVeil.style.opacity = '0';
                hudTop.innerText = '木漏れ日が、掌の餅を照らす';
            }
        },
        {   // 4枚目: 到達 = 完全な静寂
            text: '',
            enact() {
                silenceAll();                                // 音の全遮断
                experienceEnded = true;                      // 光の全消灯 (animate側)
                mistVeil.style.opacity = '0';
                hudTop.style.opacity = '0';
                hudBottom.style.opacity = '0';
                reticle.style.opacity = '0';
                ExperimentLog.add('experience_complete');
                // 静寂を5秒守ってからログUIだけを静かに出す
                setTimeout(() => {
                    document.getElementById('log-panel').style.display = 'block';
                }, 5000);
            }
        }
    ];

    function onPeel() {
        if (!experienceStarted || experienceEnded) return;
        // タップの衝撃で静止判定が一瞬解除されるため、直近1秒以内に
        // 静止していたなら「静止中のタップ」とみなす
        const recentlyStatic = isStatic || (performance.now() - lastStaticAt < 1000);
        if (!recentlyStatic) {
            ExperimentLog.add('peel_rejected_not_static');
            return;
        }
        if (layerIndex >= 4) return;

        layerIndex++;
        ExperimentLog.markPeel(layerIndex);

        const layer = LAYERS[layerIndex];
        if (layerIndex < 4) {
            playPeelSound(layerIndex);   // 剥離音は全層共通(層が進むほど高く)
            hudBottom.innerText = layer.text;
            hudBottom.style.opacity = '1';
        }
        layer.enact();
    }

    // clickが発火しない環境に備えてtouchendでも拾う(同一タップは500msで重複排除)
    let lastTapAt = 0;
    function handleTap(e) {
        if (e.target.closest('#start-button, #error-panel, #log-panel')) return;
        const now = performance.now();
        if (now - lastTapAt < 500) return;
        lastTapAt = now;
        // iOSはジェスチャ外で作られたAudioContextをsuspendedのままにするため、
        // タップ(ジェスチャ)のたびに再開を試みて音を確実に有効化する
        if (audioCtx && audioCtx.state === 'suspended' && !experienceEnded) {
            audioCtx.resume().catch(() => {});
        }
        ExperimentLog.add('tap', { type: e.type });
        onPeel();
    }
    window.addEventListener('click', handleTap);
    window.addEventListener('touchend', handleTap);

    // ---- デバッグ表示 (URLに ?debug=1 を付けると内部状態を画面下に表示) ----
    if (/[?&]debug=1/.test(location.search)) {
        const dbg = document.getElementById('debug-panel');
        dbg.style.display = 'block';
        setInterval(() => {
            const ev = ExperimentLog.events.slice(-7)
                .map(x => Math.round(x.t / 100) / 10 + 's ' + x.event + (x.detail ? ' ' + JSON.stringify(x.detail) : ''))
                .join('\n');
            dbg.textContent =
                'audio:' + (audioCtx ? audioCtx.state : 'none') +
                ' static:' + isStatic +
                ' layer:' + layerIndex +
                ' started:' + experienceStarted +
                ' gyroPerm:' + orientationPermissionState +
                ' gyroActive:' + orientationActive + '\n' + ev;
        }, 400);
    }

    /* ================================================================
     * 起動シーケンス
     * ================================================================ */
    async function startExperience() {
        ExperimentLog.add('start_pressed', { condition: CONDITION, framed: isFramed() });
        try {
            await setupCamera();
        } catch (err) {
            handleCameraError(err);
            return; // エラーパネルのボタン経由で再試行 or スキップ
        }
        await continueBoot();
    }

    async function continueBoot() {
        initAudio();
        init3D();
        // AudioContextはユーザージェスチャ直後でないと再開できない場合がある
        if (audioCtx.state === 'suspended') await audioCtx.resume().catch(() => {});

        const gyroOk = await setupOrientation();
        if (!gyroOk) enableFallbackStaticMode();

        hudTop.style.opacity = '0.3';
        hudBottom.style.opacity = '1';
        experienceStarted = true;
        ExperimentLog.add('experience_start', { gyro: gyroOk, camera: cameraActive });
    }

    // iOSではセンサー許可とカメラ許可がそれぞれ独立したタップ(ジェスチャ)を
    // 必要とするため、起動を2タップに分ける。
    let bootPhase = 0;
    document.getElementById('start-button').addEventListener('click', async function() {
        if (bootPhase === 0) {
            bootPhase = 1;
            // タップ直後(ジェスチャ内)にAudioContextを生成すると
            // iOSでも最初からrunningになり、確実に音が出る
            initAudio();
            const unlock = audioCtx.createBufferSource();
            unlock.buffer = audioCtx.createBuffer(1, 1, 22050);
            unlock.connect(audioCtx.destination);
            unlock.start(0);
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            await requestOrientationPermission();
            this.innerText = 'つづける ── カメラをひらく';
            return;
        }
        this.style.display = 'none';
        await startExperience();
    });

    // ページ離脱時: 未完了でもログを保全(sendBeaconは使えないためGAS呼び出しを試行)
    window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && !experienceEnded && layerIndex > 0) {
            ExperimentLog.add('session_abandoned', { atLayer: layerIndex });
        }
    });
    </script>
</body>
</html>
